name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref when new commits land.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (linux x86_64)
    # Match the release runner (glibc 2.35) so CI catches what would break a release.
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install native crash reporter build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libunwind-dev zlib1g-dev autoconf automake libtool
          python3 -m pip install cmake==3.28.3

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # build.rs fetches libFunction-linux-x86_64.so from cdn.fxn.ai and links it.
      - name: Build
        run: cargo build --locked --target "$TARGET"

      - name: Test
        run: cargo test --locked --target "$TARGET"

      - name: Verify panic and fatal-signal reports in isolated subprocesses
        run: |
          cargo build --locked --target "$TARGET" --example crash_probe
          python3 tests/check_crash_reporting.py "target/$TARGET/debug/examples/crash_probe"
