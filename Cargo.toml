[package]
name = "muna-server"
version = "0.0.9"
edition = "2021"
description = "OpenAI- and Anthropic-compatible Muna inference server."
license = "Apache-2.0"
publish = false

[dependencies]
async-channel = "2"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
dashmap = "6"
dotenvy = "0.15.7"
futures-util = "0.3"
indicatif = "0.18.6"
libc = "0.2"
muna = "0.0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "ipc-transport", "tcp-transport"] }

[dev-dependencies]
bytes = "1"

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
